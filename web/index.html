<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SakuAI — Otak Kedua</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#facc15">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
<style>
* { box-sizing: border-box; font-family: 'Courier New', monospace; }
body { background: #fdf6e3; background-image: radial-gradient(#cbd5e1 1.5px, transparent 1.5px); background-size: 18px 18px; color: #111; padding: 14px 14px 90px; max-width: 480px; margin: auto; }
.screen { display: none; animation: fadeIn 0.15s ease-in; }
.screen.active { display: block; }
@keyframes fadeIn { from { opacity: 0.4; } to { opacity: 1; } }
.card { background: #fff; border: 3px solid #111; border-radius: 16px; box-shadow: 5px 5px 0 #111; padding: 16px; margin-bottom: 16px; }
.badge { display: inline-block; background: #facc15; border: 2px solid #111; border-radius: 8px; padding: 3px 9px; font-weight: 900; font-size: 10px; box-shadow: 2px 2px 0 #111; margin-bottom: 8px; }
h1 { font-size: 20px; margin: 0 0 12px; text-transform: uppercase; font-weight: 900; }
.stat-box { background: #67e8f9; border: 3px solid #111; border-radius: 12px; padding: 14px; text-align: center; box-shadow: 4px 4px 0 #111; margin-bottom: 12px; }
.stat-val { font-size: 24px; font-weight: 900; margin-top: 4px; }
.grid-2 { display: flex; gap: 10px; margin-bottom: 12px; }
.mini-card { flex: 1; background: #fef08a; border: 3px solid #111; border-radius: 12px; padding: 12px; text-align: center; box-shadow: 3px 3px 0 #111; cursor: pointer; }
.mini-num { font-size: 20px; font-weight: 900; }
textarea { width: 100%; padding: 12px; border: 3px solid #111; border-radius: 10px; background: #fff; font-weight: bold; font-size: 13px; outline: none; resize: none; }
.row-btns { display: flex; gap: 10px; margin-top: 10px; }
.btn-pink { flex: 2; background: #f472b6; border: 3px solid #111; border-radius: 10px; padding: 11px; font-weight: 900; font-size: 11px; cursor: pointer; box-shadow: 3px 3px 0 #111; text-align: center; }
.btn-voice { flex: 1; background: #e879f9; border: 3px solid #111; border-radius: 10px; padding: 11px; font-weight: 900; font-size: 11px; cursor: pointer; box-shadow: 3px 3px 0 #111; }
.btn-green { width: 100%; background: #22c55e; border: 3px solid #111; border-radius: 10px; padding: 14px; margin-top: 12px; font-weight: 900; font-size: 13px; cursor: pointer; box-shadow: 4px 4px 0 #111; }
.sub-tabs { display: flex; gap: 8px; margin-bottom: 12px; }
.sub-btn { flex: 1; padding: 9px; border: 3px solid #111; border-radius: 10px; background: #e5e7eb; font-weight: 900; font-size: 11px; cursor: pointer; box-shadow: 3px 3px 0 #111; }
.sub-btn.active { background: #facc15; }
.rem-item { border: 3px solid #111; border-radius: 12px; padding: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; box-shadow: 3px 3px 0 #111; gap: 8px; }
.urgent { background: #f87171; } .soon { background: #fde047; } .safe { background: #86efac; } .note-bg { background: #e0f2fe; }
.btn-done { background: #fff; border: 2px solid #111; border-radius: 8px; padding: 6px 10px; font-weight: 900; font-size: 10px; cursor: pointer; box-shadow: 2px 2px 0 #111; }
table { width: 100%; border-collapse: collapse; font-size: 11px; }
th, td { border: 2px solid #111; padding: 6px; text-align: left; }
th { background: #111; color: #fff; }
.btn-csv { display: block; text-align: center; text-decoration: none; color: #111; background: #38bdf8; border: 3px solid #111; border-radius: 10px; padding: 11px; margin-top: 12px; font-weight: 900; font-size: 12px; box-shadow: 3px 3px 0 #111; }
.bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; max-width: 480px; margin: auto; background: #fff; border-top: 3px solid #111; display: flex; padding: 8px; gap: 6px; z-index: 99; }
.nav-item { flex: 1; background: #f1f5f9; border: 2px solid #111; border-radius: 10px; padding: 8px 2px; font-weight: 900; font-size: 10px; text-align: center; cursor: pointer; box-shadow: 2px 2px 0 #111; }
.nav-item.active { background: #facc15; transform: translateY(-2px); }
.btn-del { background: #fff; border: 2px solid #111; border-radius: 6px; padding: 2px 6px; font-weight: 900; font-size: 10px; cursor: pointer; }
.btn-voice.rec { background: #f87171; }
#toast { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); background: #111; color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 12px; font-weight: bold; max-width: 90%; z-index: 200; display: none; }
.empty { font-size: 12px; font-weight: bold; }
.month-total { font-size: 11px; font-weight: bold; margin-top: 4px; }
</style>
</head>
<body>

<div id="layer-home" class="screen active">
  <div class="card">
    <span class="badge">BERANDA • V3.0</span>
    <h1>RINGKASAN HARI INI</h1>
    <div style="display:flex;gap:6px;margin-bottom:12px;"><input type="text" id="tanya-db" onkeydown="if(event.key==='Enter')cariMemori()" placeholder="Tanya memori: Kapan ganti oli?" style="flex:1;padding:10px;border:3px solid #111;border-radius:10px;font-weight:bold;font-size:12px;"><button onclick="cariMemori()" id="btn-tanya" style="background:#facc15;border:3px solid #111;border-radius:10px;padding:0 12px;font-weight:900;cursor:pointer;box-shadow:3px 3px 0 #111;">🔍</button></div><div id="hasil-memori" style="background:#e0f2fe;border:2px dashed #111;border-radius:8px;padding:10px;margin-bottom:12px;font-size:12px;font-weight:bold;display:none;"></div><div class="stat-box">
      <div style="font-size:11px;font-weight:900;">TOTAL PENGELUARAN</div>
      <div class="stat-val" id="home-total">Rp 0</div>
      <div class="month-total" id="home-month">Bulan ini: Rp 0</div>
    </div>
    <div class="grid-2">
      <div class="mini-card" onclick="bukaLayer('layer-tasks', 'nav-tasks')">
        <div class="mini-num" id="home-rem-count">0</div>
        <div style="font-size:11px;font-weight:bold;">⏰ JADWAL AKTIF</div>
      </div>
      <div class="mini-card" style="background:#e0f2fe;" onclick="bukaLayer('layer-tasks', 'nav-tasks')">
        <div class="mini-num" id="home-note-count">0</div>
        <div style="font-size:11px;font-weight:bold;">📝 CATATAN MEMO</div>
      </div>
    </div>
    <div style="font-size:11px;font-weight:900;margin-bottom:6px;">⚠️ PERINGATAN PALING DEKAT:</div>
    <div id="home-urgent-box"></div>
    <button class="btn-green" onclick="bukaLayer('layer-input', 'nav-input')">➕ CATAT / SCAN BARU</button>
  </div>
</div>

<div id="layer-input" class="screen">
  <div class="card">
    <span class="badge">INPUT PINTAR AI</span>
    <h1>TAMBAH DATA BARU</h1>
    <textarea id="input-santai" rows="4" placeholder="Ketik santai: 'Ganti oli 65rb, ingatkan servis 2 bulan lagi' atau simpan ide catatan..."></textarea>
    <div id="info-foto" style="font-size:11px;font-weight:bold;color:#be185d;margin-top:6px;display:none;"></div>
    <div class="row-btns">
      <label class="btn-pink">📎 UPLOAD FILE / FOTO<input type="file" accept="image/*,.pdf,.txt,.csv" style="display:none;" onchange="siapkanFoto(this)"></label>
      <button type="button" class="btn-voice" onclick="mulaiSuara()">🎤 SUARA</button>
    </div>
    <button class="btn-green" id="btn-kirim" onclick="prosesSemua()">⚡ PROSES OTOMATIS AI</button>
    <div id="kotak-saran" style="background:#fef08a;border:2px dashed #111;border-radius:8px;padding:10px;margin-top:12px;font-size:12px;font-weight:bold;display:none;"></div>
  </div>
</div>

<div id="layer-tasks" class="screen">
  <div class="sub-tabs">
    <button class="sub-btn active" id="sub-rem" onclick="gantiSub('rem')">⏰ PENGINGAT</button>
    <button class="sub-btn" id="sub-note" onclick="gantiSub('note')">📝 CATATAN BEBAS</button>
  </div>
  <div id="panel-rem"></div>
  <div id="panel-note" style="display:none;"></div>
</div>

<div id="layer-money" class="screen">
  <div class="card">
    <span class="badge">AUDIT KEUANGAN</span>
    <h1>REKAP PENGELUARAN</h1>
    <div style="overflow-x:auto;">
      <table>
        <thead><tr><th>Tgl</th><th>Kategori</th><th>Item</th><th>Nominal</th><th></th></tr></thead>
        <tbody id="tabel-pengeluaran"></tbody>
      </table>
    </div>
    <a href="/export-csv" class="btn-csv">📥 UNDUH EXCEL (.CSV)</a>
  </div>
</div>

<div id="toast"></div>

<div class="bottom-nav">
  <div class="nav-item active" id="nav-home" onclick="bukaLayer('layer-home', 'nav-home')">🏠<br>BERANDA</div>
  <div class="nav-item" id="nav-input" onclick="bukaLayer('layer-input', 'nav-input')">➕<br>INPUT AI</div>
  <div class="nav-item" id="nav-tasks" onclick="bukaLayer('layer-tasks', 'nav-tasks')">⏰<br>JADWAL</div>
  <div class="nav-item" id="nav-money" onclick="bukaLayer('layer-money', 'nav-money')">💸<br>KEUANGAN</div>
</div>
<script>
let fotoBase64 = "";
let fotoMime = "image/jpeg";
let teksFile = "";            // isi file .txt/.csv (disensor privasinya di server)
const MAX_UPLOAD = 8 * 1024 * 1024;

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rp = n => 'Rp ' + Math.round(Number(n) || 0).toLocaleString('id-ID');

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(toast._t); toast._t = setTimeout(() => t.style.display = 'none', 3500);
}

async function api(url, opts) {
  let res;
  try { res = await fetch(url, opts); }
  catch (e) { throw new Error('Server tidak terjangkau. Pastikan server SakuAI masih berjalan.'); }
  let data = {};
  try { data = await res.json(); } catch (e) {}
  if (!res.ok) throw new Error(data.pesan || ('Terjadi kesalahan (' + res.status + ')'));
  return data;
}

function bukaLayer(idLayer, idNav) {
  document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  document.getElementById(idLayer).classList.add('active');
  document.getElementById(idNav).classList.add('active');
  window.scrollTo(0, 0);
}

function gantiSub(tab) {
  document.getElementById('panel-rem').style.display = tab === 'rem' ? 'block' : 'none';
  document.getElementById('panel-note').style.display = tab === 'note' ? 'block' : 'none';
  document.getElementById('sub-rem').classList.toggle('active', tab === 'rem');
  document.getElementById('sub-note').classList.toggle('active', tab === 'note');
}

// Upload: foto (diperkecil), PDF, atau teks (.txt/.csv).
function siapkanFoto(input) {
  const file = input.files && input.files[0];
  input.value = '';
  if (!file) return;
  const info = document.getElementById('info-foto');
  const nama = file.name.toLowerCase();
  const isImg = file.type.startsWith('image/');
  const isPdf = file.type === 'application/pdf' || nama.endsWith('.pdf');
  const isTeks = file.type.startsWith('text/') || /\.(txt|csv)$/.test(nama);
  if (!isImg && !isPdf && !isTeks) { toast('Format belum didukung. Pakai foto, PDF, TXT, atau CSV.'); return; }
  if (!isImg && file.size > MAX_UPLOAD) { toast('File terlalu besar (maksimal 8 MB).'); return; }

  fotoBase64 = ''; teksFile = '';
  info.style.display = 'block';
  info.textContent = '⏳ Memuat file: ' + file.name + '...';
  const gagal = () => { info.style.display = 'none'; toast('File tidak bisa dibaca. Coba file lain.'); };

  if (isTeks) {
    const r = new FileReader();
    r.onload = e => {
      teksFile = '[ISI FILE ' + file.name + ']\n' + String(e.target.result).slice(0, 20000);
      info.textContent = '📄 Teks siap: ' + file.name + ' (' + Math.round(file.size / 1024) + ' KB)';
    };
    r.onerror = gagal;
    r.readAsText(file);
  } else if (isPdf) {
    const r = new FileReader();
    r.onload = e => {
      fotoBase64 = String(e.target.result).split(',')[1];
      fotoMime = 'application/pdf';
      info.textContent = '📄 PDF siap: ' + file.name + ' (' + Math.round(file.size / 1024) + ' KB)';
    };
    r.onerror = gagal;
    r.readAsDataURL(file);
  } else {
    // Foto: perkecil dulu (maks 1280px, JPEG) supaya upload cepat & hemat kuota
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = function () {
      const scale = Math.min(1, 1280 / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      fotoMime = 'image/jpeg';
      fotoBase64 = c.toDataURL('image/jpeg', 0.85).split(',')[1];
      URL.revokeObjectURL(url);
      info.textContent = '📷 Foto siap: ' + file.name + ' (' + Math.round(fotoBase64.length * 0.75 / 1024) + ' KB)';
    };
    img.onerror = function () { URL.revokeObjectURL(url); gagal(); };
    img.src = url;
  }
}

// Suara: Web Speech API (Chrome/Android). Jika tidak ada, pakai mikrofon keyboard.
let rec = null;
function mulaiSuara() {
  const box = document.getElementById('input-santai');
  const btn = document.querySelector('.btn-voice');
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { box.focus(); toast('Browser ini belum mendukung suara. Pakai ikon mikrofon di keyboard HP.'); return; }
  if (rec) { rec.stop(); return; }
  rec = new SR();
  rec.lang = 'id-ID'; rec.interimResults = false;
  rec.onstart = () => { btn.classList.add('rec'); btn.textContent = '⏹ STOP'; };
  rec.onresult = e => {
    const t = Array.from(e.results).map(r => r[0].transcript).join(' ');
    box.value = (box.value ? box.value + ' ' : '') + t;
  };
  rec.onerror = e => toast('Suara gagal: ' + e.error);
  rec.onend = () => { rec = null; btn.classList.remove('rec'); btn.textContent = '🎤 SUARA'; };
  rec.start();
}

async function cariMemori() {
  const q = document.getElementById('tanya-db').value;
  if (!q.trim()) return;
  const box = document.getElementById('hasil-memori');
  box.style.display = 'block'; box.textContent = '⏳ Mencari ingatan...';
  try {
    const d = await api('/tanya-memori', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ pertanyaan: q }) });
    box.textContent = '🧠 ' + d.jawaban;
  } catch (e) { box.textContent = '⚠️ ' + e.message; }
}

function labelSisa(d) {
  if (d < 0) return Math.abs(d) + ' hari terlambat';
  if (d === 0) return 'HARI INI';
  return d + ' hari lagi';
}

async function muatData() {
  let data;
  try { data = await api('/dashboard-data'); }
  catch (e) { toast(e.message); return; }

  document.getElementById('home-total').textContent = rp(data.total_pengeluaran);
  document.getElementById('home-month').textContent = 'Bulan ini: ' + rp(data.total_bulan_ini);
  document.getElementById('home-rem-count').textContent = data.pengingat.length;
  document.getElementById('home-note-count').textContent = data.catatan.length;

  const urgentBox = document.getElementById('home-urgent-box');
  urgentBox.innerHTML = !data.pengingat.length
    ? '<div class="empty" style="padding:8px;background:#f1f5f9;border:2px solid #111;border-radius:8px;">Semua jadwal aman terkendali!</div>'
    : data.pengingat.slice(0, 3).map(t => {
        const kls = t.sisa_hari <= 1 ? 'urgent' : (t.sisa_hari <= 7 ? 'soon' : 'safe');
        return `<div class="rem-item ${kls}" style="margin-bottom:8px;"><div><b>${esc(t.judul)}</b><br><span style="font-size:11px;">Target: ${esc(t.jatuh_tempo)} (${labelSisa(t.sisa_hari)})</span></div></div>`;
      }).join('');

  document.getElementById('panel-rem').innerHTML = !data.pengingat.length
    ? '<div class="card empty">Belum ada jadwal pengingat.</div>'
    : data.pengingat.map(r => {
        const kls = r.sisa_hari <= 1 ? 'urgent' : (r.sisa_hari <= 7 ? 'soon' : 'safe');
        return `<div class="rem-item ${kls}"><div><b>${esc(r.judul)}</b><br><span style="font-size:11px;">${esc(r.jatuh_tempo)} (${labelSisa(r.sisa_hari)})</span></div><button class="btn-done" onclick="aksi('/selesai-pengingat/${r.id}')">✔ SELESAI</button></div>`;
      }).join('');

  document.getElementById('panel-note').innerHTML = !data.catatan.length
    ? '<div class="card empty">Belum ada catatan bebas.</div>'
    : data.catatan.map(n => `<div class="rem-item note-bg"><div><span style="font-size:10px;">${esc(n.tanggal)}</span><br><b style="font-size:12px;">${esc(n.isi)}</b></div><button class="btn-done" onclick="aksi('/hapus-catatan/${n.id}')">🗑 HAPUS</button></div>`).join('');

  document.getElementById('tabel-pengeluaran').innerHTML = !data.pengeluaran.length
    ? '<tr><td colspan="5" class="empty">Belum ada pengeluaran tercatat.</td></tr>'
    : data.pengeluaran.map(e => `<tr><td>${esc(String(e.tanggal).slice(5))}</td><td><b>${esc(e.kategori)}</b></td><td>${esc(e.keterangan)}</td><td>${rp(e.nominal)}</td><td><button class="btn-del" title="Hapus" onclick="hapusPengeluaran(${e.id})">✕</button></td></tr>`).join('');
}

async function prosesSemua() {
  const teksKetik = document.getElementById('input-santai').value;
  if (!teksKetik.trim() && !fotoBase64 && !teksFile) { toast('Ketik catatan atau pilih file/foto dulu.'); return; }
  const teks = teksFile ? (teksKetik + '\n\n' + teksFile).trim() : teksKetik;
  const btn = document.getElementById('btn-kirim');
  const saranBox = document.getElementById('kotak-saran');
  btn.textContent = '⏳ MEMPROSES...'; btn.disabled = true;
  try {
    const data = await api('/catat-pintar', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ teks, image_base64: fotoBase64, mime_type: fotoMime })
    });
    document.getElementById('input-santai').value = '';
    fotoBase64 = ''; teksFile = '';
    document.getElementById('info-foto').style.display = 'none';
    const h = data.hasil;
    saranBox.style.display = 'block';
    saranBox.textContent = `🤖 ${h.saran_singkat || 'Tersimpan!'}  (${h.pengeluaran.length} pengeluaran, ${h.pengingat.length} jadwal, ${h.catatan.length} catatan)`;
    await muatData();
  } catch (e) {
    toast(e.message);
  } finally {
    btn.textContent = '⚡ PROSES OTOMATIS AI'; btn.disabled = false;
  }
}

async function aksi(url) {
  try { await api(url, { method: 'POST' }); } catch (e) { toast(e.message); }
  muatData();
}

function hapusPengeluaran(id) {
  if (confirm('Hapus pengeluaran ini?')) aksi('/hapus-pengeluaran/' + id);
}

muatData();
if ('serviceWorker' in navigator) { navigator.serviceWorker.register('/sw.js').catch(() => {}); }
</script>
</body>
</html>
